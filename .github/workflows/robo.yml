name: Robô do Benfica Independente

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ir buscar agenda, resultados, vídeos, resumos e crónicas
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python robo.py
      - name: Guardar o que mudou
        run: |
          git config user.name "robo-bi"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data/agenda.json data/results.json data/videos.json data/summaries.json data/club.json data/history.json data/podcast_videos.json data/redes.json data/quiz.json data/jogos_reais.json data/redes_agente.json data/live.json; then
            echo "Sem novidades."
          else
            git commit -m "Atualização automática"
            # A plataforma de gestão também grava aqui: junta-se ao que ela gravou entretanto.
            git pull --rebase -X theirs || (git rebase --abort; git pull --rebase)
            git push
          fi
